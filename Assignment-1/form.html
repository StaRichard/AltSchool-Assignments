<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Esther Ononakpo - AltSchool Application Form</title>
    </head>

    <body>
        <header>
            <h1>AltSchool Application Form </h1>

            <nav aria-label="Main Navigation">
                <a href="index.html">About Me</a>
                <a href="form.html">Application Form</a>
            </nav>
        </header>
        
        <main>
            <section>
                <h2>Application Form</h2>
                <p>Fll in your details below.</p>

                <form>

                    <p>
                        <label for="email">Email:</label><br>
                        <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="jane.doe@example.com" 
                        required
                        >
                    </p>

                    <p>
                        <label for="first-name">First Name:</label><br>
                        <input
                        type="text"
                        id="first-name"
                        name="first-name"
                        placeholder="Jane"
                        required
                        >
                    </p>

                    <p> 
                        <label for="last-name">Last Name:</label><br>
                        <input
                        type="text"
                        id="last-name"
                        name="last-name"
                        placeholder="Doe"
                        required
                        >
                    </p>

                    <p>
                        <label for="phone">Phone Number:</label><br>
                        <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="+234 123 456 7890"
                        required
                        >
                    </p>

                    <p>
                        <label for="password">Password:</label><br>
                        <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        >
                    </p>

                    <p>
                        <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        >
                        <label for="terms">
                            I agree to the terms of use and acknowledge that I have read the Privacy Policy
                        </label>
                    </p>

                    <p>
                        <button type="submit">Create Account</button>
                    </p>

                    <p>OR</p>

                    <p>
                        <button type="button">Login with Google</button>
                    </p>



                </form>
            </section>
        </main>
        <footer>
            <address>
                Lagos, Nigeria
            </address>

            <p>&copy; 2023 Esther Oghenekaro Ononakpo. All rights reserved.</p>
        </footer>
    </body>

</html>
